name: Deploy frontend

on:
  push:
    branches: [main]
    paths:
      - "apps/frontend/**"
      - ".github/workflows/deploy-frontend.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/frontend
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          # The frontend has its own lockfile, separate from the API's.
          cache-dependency-path: apps/frontend/package-lock.json

      - run: npm ci

      - name: Build static site
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: ${{ vars.API_BASE_URL }}
          # Project site lives under /<repo>/ until a custom domain is attached.
          NEXT_PUBLIC_BASE_PATH: /${{ github.event.repository.name }}

      # GitHub Pages' Jekyll step drops folders starting with "_", which would remove _next/.
      - run: touch out/.nojekyll

      - uses: actions/upload-pages-artifact@v4
        with:
          path: apps/frontend/out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
